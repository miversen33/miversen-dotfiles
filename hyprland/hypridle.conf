general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Stage 1: Dim screen and turn off keyboard lights (3 minutes)
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10 && echo 0 > /sys/class/leds/dell::kbd_backlight/brightness
    on-resume = brightnessctl -r
}

# Stage 2: Switch to power-saver profile (5 minutes)
listener {
    timeout = 300
    on-timeout = touch /tmp/.miversen-hypridle-power-override && powerprofilesctl set power-saver
    on-resume = rm -f /tmp/.miversen-hypridle-power-override && /home/miversen/.dotfiles/scripts/manage-battery.sh
}

# Stage 3: Conditional sleep based on power state (15 minutes)
listener {
    timeout = 900
    on-timeout = /home/miversen/.dotfiles/scripts/conditional-sleep.sh
}
